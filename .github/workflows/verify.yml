name: Verify AgentKey
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm check
      - run: pnpm package:dir
      - name: Electron smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:e2e
      - name: Electron smoke on Windows and macOS
        if: runner.os != 'Linux'
        run: pnpm test:e2e
      - name: Save failed Electron test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: electron-failures-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
