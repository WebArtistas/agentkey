name: agentkey-demo
services:
  database:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    user: '70:70'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - '127.0.0.1:55432:5432'
    environment:
      POSTGRES_DB: agentkey_demo
      POSTGRES_PASSWORD: agentkey-demo-admin-only
    tmpfs:
      - /var/lib/postgresql:rw,nosuid,size=256m,uid=70,gid=70
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/00-agentkey.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d agentkey_demo']
      interval: 2s
      timeout: 3s
      retries: 15
